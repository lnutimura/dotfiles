"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

command_timeout = 2000

right_format = """$time"""

[time]
format = '$time'

[git_status]
format = '([$all_status](bold red) )([$ahead_behind](bold green) )'

ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"

deleted = "✘${count}"
modified = "!${count}"
renamed = "»${count}"
staged = "+${count}"
untracked = "?${count}"
