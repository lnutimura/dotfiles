[global/wm]
margin-bottom = 0
margin-top = 0

; mistpine (https://github.com/mistpine/mistpine.polybar): the [colors]
; section, as ${colors.<name>}.
include-file = ~/.config/polybar/mistpine.ini
include-file = ~/.config/polybar/modules.ini

[bar/primary]
monitor = ${env:MONITOR:}

enable-ipc = true

separator = 

bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

; The focused workspace's underline.
line-size = 2pt

modules-left = cpu sep memory sep filesystem
modules-center = i3
modules-right = network sep pipewire sep date sep tray

module-margin-left = 0
module-margin-right = 0

scroll-up = "#i3.prev"
scroll-down = "#i3.next"

font-0 = "InconsolataGo Nerd Font:style=Regular:size=11;0"
font-1 = "InconsolataGo Nerd Font:style=Bold:size=11;0"
font-2 = "FontAwesome:style=Regular;0"

