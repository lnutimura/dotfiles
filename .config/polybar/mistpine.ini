; The names Polybar's default config reads, as mistpine's roles.
; the bar, a status line
background     = ${colors.bg2}
; raised: the focused workspace
background-alt = ${colors.bg3}
; text on the bar
foreground     = ${colors.fg2}
; labels and highlights
primary        = ${colors.yellow}
; the accent
secondary      = ${colors.blue}
; urgent and failing
alert          = ${colors.red}
; idle, empty, offline
disabled       = ${colors.fg1}
