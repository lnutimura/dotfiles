onboarding = false
[theme]
name = "gruvbox"

[keys]
prefix = "ctrl+t"

split_horizontal = "prefix+\""
split_vertical   = "prefix+%"

[ui]
agent_panel_sort = "spaces"
pane_borders = true
prompt_new_tab_name = false
status_indicators = "dots"

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace", "tab"],
  ["state_text", "agent"],
]

# qq88976321/herdr-copy-search
[[keys.command]]
key = "prefix+["
type = "plugin_action"
command = "copy-search.copy"

[[keys.command]]
key = "prefix+/"
type = "plugin_action"
command = "copy-search.search"

[[keys.command]]
key = "prefix+tab"
type = "plugin_action"
command = "copy-search.extract"

# luan.reviewr
[[keys.command]]
key = "prefix+alt+r"
type = "plugin_action"
command = "luan.reviewr.review"
description = "review copied GitHub PR with Cursor"
