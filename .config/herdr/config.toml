onboarding = false
[theme]
name = "gruvbox"

[keys]
prefix = "ctrl+t"

split_horizontal = "prefix+\""
split_vertical   = "prefix+%"

[ui]
agent_panel_sort = "spaces"
pane_borders = true
prompt_new_tab_name = false
status_indicators = "dots"

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace", "tab"],
  ["state_text", "terminal_title"],
]

# qq88976321/herdr-copy-search
[[keys.command]]
key = "prefix+["
type = "plugin_action"
command = "copy-search.copy"

[[keys.command]]
key = "prefix+/"
type = "plugin_action"
command = "copy-search.search"

[[keys.command]]
key = "prefix+tab"
type = "plugin_action"
command = "copy-search.extract"

# Toasts used by herdr_notify (WeeChat).
[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"
