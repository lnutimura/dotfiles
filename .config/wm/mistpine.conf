# The palette, for your own bar colors, gaps or borders.
set $mistpine-bg0           #071921
set $mistpine-bg1           #0b1f27
set $mistpine-bg2           #0f272e
set $mistpine-bg3           #152f37
set $mistpine-bg4           #26414a
set $mistpine-fg0           #4e6570
set $mistpine-fg1           #8796a0
set $mistpine-fg2           #a7b0bb
set $mistpine-fg3           #c4c9d0
set $mistpine-red           #be7356
set $mistpine-orange        #c98b56
set $mistpine-yellow        #c2a55b
set $mistpine-green         #8a9a5b
set $mistpine-cyan          #5f9a96
set $mistpine-blue          #6f8fa8
set $mistpine-purple        #8c84b4
set $mistpine-pink          #c08a9c
set $mistpine-bright-red    #d08a6e
set $mistpine-bright-green  #a9b97a
set $mistpine-bright-yellow #dcc27e
set $mistpine-bright-blue   #93afc4
set $mistpine-bright-purple #b8a8c6
set $mistpine-bright-cyan   #86bcb6

# Window colors. The title bar is border and background; the frame is
# child_border; indicator marks where the next window opens.
# class                  border         background    text          indicator        child_border
client.focused           $mistpine-blue $mistpine-bg3 $mistpine-fg3 $mistpine-orange $mistpine-blue
client.focused_inactive  $mistpine-bg4  $mistpine-bg2 $mistpine-fg2 $mistpine-bg4    $mistpine-bg4
client.focused_tab_title $mistpine-bg4  $mistpine-bg2 $mistpine-fg2
client.unfocused         $mistpine-bg2  $mistpine-bg0 $mistpine-fg1 $mistpine-bg2    $mistpine-bg2
client.urgent            $mistpine-red  $mistpine-red $mistpine-bg0 $mistpine-red    $mistpine-red
client.placeholder       $mistpine-bg0  $mistpine-bg0 $mistpine-fg2 $mistpine-bg0    $mistpine-bg0

# i3 paints this behind windows that do not fill their space; sway
# accepts it and does nothing.
client.background $mistpine-bg1
